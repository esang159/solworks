# 사이트가 브라우저에서 직접 못 부르는 API(키를 숨겨야 하거나 브라우저 호출을 막는 곳)를 대신 불러 주는 중계 서버.
# .github/workflows/worker.yml 이 GitHub에 올라온 이 폴더를 Cloudflare에 배포한다.
name = "solworks-relay"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# 매일 08:47 KST(=23:47 UTC)에 사업공고 수집을 GitHub 에서 실행시킨다 (GitHub 예약 실행은 자주 늦거나 빠짐)
[triggers]
crons = ["47 23 * * *"]

[vars]
# Firebase 웹 설정값(공개용). 로그인 증표 확인에만 쓴다.
FIREBASE_API_KEY = "AIzaSyAFCCWL4yFJ0_B63jlVxmMucj2XNZfr5Hs"
ALLOWED_ORIGINS = "https://www.solworks.store,https://solworks.store"
# 정시 실행으로 부를 GitHub 워크플로
GH_REPO = "esang159/solworks"
GH_WORKFLOW = "crawl.yml"
GH_REF = "claude/wonderful-cerf-4b9ppx"
