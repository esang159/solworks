name: 공고 찾기

# 특정 공고가 NTIS·IRIS 어디에 있는지 찾아보는 수동 실행용 (Actions 탭 → Run workflow → 검색어)
on:
  workflow_dispatch:
    inputs:
      words:
        description: "검색어 (여러 개면 띄어쓰기로)"
        required: true
        default: "IRES 학생인력교류"

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 찾기
        env:
          WORDS: ${{ inputs.words }}
        run: python tools/find_notice.py $WORDS
