name: 중계 서버 점검

# 로그인한 사람처럼 중계 서버를 실제로 불러 본다.
# 1) 네이버를 키로 직접 불러 키가 맞는지  2) 테스트용 로그인 증표를 만들어 중계 서버로 검색
on: workflow_dispatch

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 네이버 키 직접 확인
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
        run: |
          [ -n "$NAVER_ID" ] && echo "NAVER_ID 있음 (${#NAVER_ID}자)" || echo "NAVER_ID 없음"
          [ -n "$NAVER_SECRET" ] && echo "NAVER_SECRET 있음 (${#NAVER_SECRET}자)" || echo "NAVER_SECRET 없음"
          q="query=%EC%B6%98%EC%B2%9C%EC%97%AD%20%EB%A7%9B%EC%A7%91&display=5"
          echo "== NAVER API HUB"
          curl -sS -w "\nHTTP %{http_code}\n" "https://naverapihub.apigw.ntruss.com/search/v1/local?$q" \
            -H "X-NCP-APIGW-API-KEY-ID: $NAVER_ID" -H "X-NCP-APIGW-API-KEY: $NAVER_SECRET" | head -c 1500; echo
          echo "== 다음 페이지 (start=6, display=5)"
          curl -sS -w "\nHTTP %{http_code}\n" "https://naverapihub.apigw.ntruss.com/search/v1/local?$q&start=6" \
            -H "X-NCP-APIGW-API-KEY-ID: $NAVER_ID" -H "X-NCP-APIGW-API-KEY: $NAVER_SECRET" | head -c 700; echo
          echo "== 한 번에 10개 (display=10)"
          curl -sS "https://naverapihub.apigw.ntruss.com/search/v1/local?query=%EC%B6%98%EC%B2%9C%20%EB%A7%9B%EC%A7%91&display=10" \
            -H "X-NCP-APIGW-API-KEY-ID: $NAVER_ID" -H "X-NCP-APIGW-API-KEY: $NAVER_SECRET" | python3 -c "import sys,json;d=json.load(sys.stdin);print('total',d.get('total'),'display',d.get('display'),'items',len(d.get('items',[])))" || true
          echo "== 예전 개발자센터"
          curl -sS -w "\nHTTP %{http_code}\n" "https://openapi.naver.com/v1/search/local.json?$q" \
            -H "X-Naver-Client-Id: $NAVER_ID" -H "X-Naver-Client-Secret: $NAVER_SECRET" | head -c 300; echo
      - name: 정시 수집 토큰 확인 (GH_DISPATCH_TOKEN)
        env:
          T: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          [ -n "$T" ] && echo "GH_DISPATCH_TOKEN 있음" || { echo "GH_DISPATCH_TOKEN 없음"; exit 0; }
          echo "== 워크플로 읽기"; curl -sS -o /dev/null -w "HTTP %{http_code}\n" -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" https://api.github.com/repos/esang159/solworks/actions/workflows/crawl.yml
          echo "== 실행 요청 (오늘 이미 했으면 워크플로가 건너뜀, 카톡 안 감)"
          curl -sS -o /dev/null -w "HTTP %{http_code} (204면 성공)\n" -X POST -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/esang159/solworks/actions/workflows/crawl.yml/dispatches -d '{"ref":"claude/wonderful-cerf-4b9ppx","inputs":{"scheduled":"true"}}'
      - name: ODsay를 서버에서 부를 수 있는지 (지금 페이지에 있는 키로)
        run: |
          k="s0BOd9kJGscmQnFxFYmC6w"
          u="https://api.odsay.com/v1/api/searchPubTransPathT?SX=126.9707&SY=37.5547&EX=126.9770&EY=37.5788&OPT=0&SearchType=0&apiKey=$k"
          echo "== Referer 없이"; curl -sS "$u" | head -c 300; echo
          echo "== Referer: solworks.store"; curl -sS "$u" -H "Referer: https://www.solworks.store/travel/" -H "Origin: https://www.solworks.store" | head -c 300; echo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 로그인한 것처럼 중계 서버로 검색
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          pip install --quiet firebase-admin requests
          python - <<'PY'
          import json, os, requests, firebase_admin
          from firebase_admin import auth, credentials
          firebase_admin.initialize_app(credentials.Certificate(json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])))
          # 실제 계정이 아닌 점검 전용 uid
          ct = auth.create_custom_token("relay-check").decode()
          key = "AIzaSyAFCCWL4yFJ0_B63jlVxmMucj2XNZfr5Hs"
          r = requests.post(f"https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key={key}", json={"token": ct, "returnSecureToken": True}, timeout=20)
          print("로그인 증표:", r.status_code)
          tok = r.json().get("idToken")
          base = "https://solworks-relay.minsol2003.workers.dev"
          print("health:", requests.get(base + "/health", timeout=20).text)
          o = requests.get(base + "/odsay/path", params={"sx": 126.9707, "sy": 37.5547, "ex": 126.9770, "ey": 37.5788}, headers={"Authorization": "Bearer " + tok, "Origin": "https://www.solworks.store"}, timeout=30)
          print("[ODsay 서울역→경복궁] HTTP", o.status_code, o.text[:200])
          for q in ["춘천역 맛집", "경복궁"]:
              s = requests.get(base + "/naver/local", params={"q": q}, headers={"Authorization": "Bearer " + tok, "Origin": "https://www.solworks.store"}, timeout=20)
              print(f"[{q}] HTTP {s.status_code} CORS={s.headers.get('access-control-allow-origin')}")
              print(json.dumps(s.json(), ensure_ascii=False, indent=1)[:1500])
          PY
