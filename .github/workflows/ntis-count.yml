name: NTIS 전체 확인

# NTIS 국가R&D통합공고를 끝까지 읽어 열린 공고 수를 세는 수동 실행용
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "form = 검색 양식·엑셀 주소만, 숫자 = 한 쪽 건수로 전체 읽기"
        required: false
        default: "form"

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 전체 읽기
        env:
          MODE: ${{ inputs.mode }}
        run: python -u tools/ntis_count.py "$MODE"
