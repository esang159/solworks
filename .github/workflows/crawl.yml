name: 사업공고 수집

on:
  # GitHub 예약 실행은 붐비면 늦어지거나 빠지기도 한다 (실제로 8:47·9:37 이 매일 빠지고 10시 반 넘어 돌았다).
  # 그래서 정시 실행은 Cloudflare 중계 서버(worker/)가 08:47 에 이 워크플로를 불러서 하고(scheduled=true),
  # 아래 세 번은 그게 안 됐을 때를 위한 예비. 그날 이미 수집했으면(아래 '오늘 이미 했는지') 바로 끝난다.
  schedule:
    - cron: "47 23 * * *"  # 08:47 KST (보통 9시 전후 도착)
    - cron: "37 0 * * *"   # 09:37 KST (첫 번째가 빠졌을 때)
    - cron: "27 1 * * *"   # 10:27 KST (두 번째도 빠졌을 때)
  workflow_dispatch:        # Actions 탭에서 수동 실행
    inputs:
      kakao_test:
        description: "카카오톡 테스트 메시지 보내기"
        type: boolean
        default: false
      kakao:
        description: "카카오톡 알림 보내기 (이미 보낸 날 다시 수집할 때는 끄기)"
        type: boolean
        default: true
      scheduled:
        description: "예약 실행처럼 (오늘 이미 했으면 건너뜀) — Cloudflare 정시 실행이 켬"
        type: boolean
        default: false

permissions:
  contents: write

# 예약 실행과 수동 실행이 겹치면 차례로 돈다 (동시에 push 하다 한쪽이 거절되지 않게)
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 오늘 이미 했는지
        id: done
        if: github.event_name == 'schedule' || inputs.scheduled
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          last=$(python3 -c "import json;print(json.load(open('data/notices.json')).get('updated_at','')[:10])" 2>/dev/null || true)
          echo "오늘 $today / 마지막 수집 $last"
          if [ "$last" = "$today" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "이미 수집함 - 건너뜀"; fi
      - uses: actions/setup-python@v5
        if: steps.done.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: 라이브러리 설치 (NTIS 엑셀 읽기)
        if: steps.done.outputs.skip != 'true'
        run: pip install --quiet xlrd
      - name: 수집
        if: steps.done.outputs.skip != 'true'
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python crawler/crawl.py
      - name: 변경 사항 커밋
        if: steps.done.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/notices.json data/weather.json 2>/dev/null || git add data/notices.json
          git diff --cached --quiet || git commit -m "data: 사업공고 갱신 $(TZ=Asia/Seoul date +%F)"
          # 수집하는 동안 다른 커밋이 올라왔으면 그 위에 얹어서 올린다
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: 카카오톡 알림
        if: steps.done.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.kakao || inputs.kakao_test)
        continue-on-error: true   # 알림이 실패해도 수집 결과는 그대로 둔다
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: python crawler/notify_kakao.py ${{ inputs.kakao_test && '--test' || '' }}
