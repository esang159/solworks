name: NTIS 엑셀 확인

# NTIS 국가R&D통합공고 리스트 다운로드(엑셀)를 실제로 받아 보는 수동 실행용
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  excel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet openpyxl xlrd
      - name: 엑셀 받기
        run: python -u tools/ntis_excel.py
