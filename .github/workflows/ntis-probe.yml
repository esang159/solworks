name: NTIS 과제검색 확인

# NTIS 과제검색 OpenAPI 응답을 직접 확인하는 수동 실행용 (Actions 탭에서 Run workflow)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 과제검색 호출
        env:
          NTIS_API_KEY: ${{ secrets.NTIS_API_KEY }}
        run: python tools/ntis_probe.py
