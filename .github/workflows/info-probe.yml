name: 장소 사진·정보 확인 (임시)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 네이버 이미지·블로그 검색 (API HUB)
        env:
          ID: ${{ secrets.NAVER_ID }}
          SEC: ${{ secrets.NAVER_SECRET }}
        run: |
          q=$(python3 -c "import urllib.parse;print(urllib.parse.quote('춘천 호수별닭갈비'))")
          for t in image; do
            echo "== $t"
            curl -sS -w "\nHTTP %{http_code}\n" "https://naverapihub.apigw.ntruss.com/search/v1/$t?query=$q&display=3" \
              -H "X-NCP-APIGW-API-KEY-ID: $ID" -H "X-NCP-APIGW-API-KEY: $SEC" | head -c 1600; echo
          done
      - name: 한국관광공사 TourAPI (공공데이터포털 키)
        env:
          K: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          kw=$(python3 -c "import urllib.parse;print(urllib.parse.quote('남이섬'))")
          for svc in KorService2 KorService1; do
            echo "== $svc 키워드 검색"
            curl -sS -w "\nHTTP %{http_code}\n" "https://apis.data.go.kr/B551011/$svc/searchKeyword${svc#KorService}?serviceKey=$K&MobileOS=ETC&MobileApp=solworks&_type=json&numOfRows=2&keyword=$kw" | head -c 1500; echo
          done
          echo "== 위치 기반 음식점 (춘천역 반경 2km)"
          curl -sS -w "\nHTTP %{http_code}\n" "https://apis.data.go.kr/B551011/KorService2/locationBasedList2?serviceKey=$K&MobileOS=ETC&MobileApp=solworks&_type=json&numOfRows=3&mapX=127.7166&mapY=37.8846&radius=2000&contentTypeId=39" | head -c 1500; echo
